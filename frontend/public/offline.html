<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWAS | Offline Mode</title>
  <link rel="icon" href="/icons/icon-192x192.png">
  <meta name="theme-color" content="#022e53">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #022e53;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #022e53;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #f0f0f0;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 18px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="JWAS Logo" class="logo">
    <h1>You are Offline</h1>
    <p>Please check your internet connection. JWAS will automatically reconnect once your network is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="status" id="status-text">Disconnected</div>
  </div>

  <script>
    window.addEventListener('online', () => {
      document.getElementById('status-text').innerText = 'Connection restored! Reconnecting...';
      setTimeout(() => window.location.reload(), 1000);
    });
  </script>
</body>
</html>
